name: Download Cloudflare Protected File 🚀

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'הזן את כתובת ה-URL להורדה'
        required: true
        type: string

jobs:
  download-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: הגדרת סביבת Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: התקנת ספריות נדרשות 📦
        run: |
          pip install typing_extensions curl_cffi

      - name: הורדת הקובץ דרך הדמיית דפדפן 📥
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          python -c "
          from curl_cffi import requests
          import os
          import urllib.parse

          url = os.environ['DOWNLOAD_URL']
          print(f'מתחיל הורדה מתוך: {url}')

          response = requests.get(
              url,
              impersonate='chrome',
              timeout=60
          )

          response.raise_for_status()

          filename = 'downloaded_file'

          if 'content-disposition' in response.headers:
              cd = response.headers['content-disposition']
              if 'filename=' in cd:
                  filename = cd.split('filename=')[-1].strip('\"\\'')

          if filename == 'downloaded_file':
              parsed = urllib.parse.urlparse(url)
              path_name = os.path.basename(parsed.path)
              if path_name:
                  filename = path_name

          print(f'שומר את הקובץ בשם: {filename}')
          print(f'גודל: {len(response.content)} בייטים')

          with open(filename, 'wb') as f:
              f.write(response.content)
          "

      - name: דחיסת הקובץ לתוך ZIP 🗜️
        run: |
          python - <<'PY'
          import glob
          import zipfile
          import os

          excluded = {
              '.github',
              'compressed_archive.zip'
          }

          files = [
              f for f in glob.glob('*')
              if f not in excluded and os.path.isfile(f)
          ]

          if not files:
              raise SystemExit('לא נמצא קובץ לדחיסה')

          target = max(files, key=os.path.getsize)

          print(f'דוחס את הקובץ: {target}')

          with zipfile.ZipFile(
              'compressed_archive.zip',
              'w',
              zipfile.ZIP_DEFLATED
          ) as zf:
              zf.write(target, arcname=os.path.basename(target))
          PY

      - name: העלאת הארטיפקט 🚀
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-artifact
          path: compressed_archive.zip
