name: Download and Zip on Push 🚀

on:
  push:
    branches:
      - main # תוכל לשנות את שם הענף במידת הצורך (למשל master)

jobs:
  download-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: הורדת הקובץ מהקישור שהוגדר מראש 📥
        run: |
          # 🔗 הדבק כאן למטה את הקישור שלך בין המרכאות לפני ה-Push!
          DOWNLOAD_URL="https://apkcube.com/hill-climb-racing/com.fingersoft.hillclimb/download"
          
          echo "מתחיל בהורדת הקובץ אוטומטית..."
          curl -L "$DOWNLOAD_URL" -o downloaded_file

      - name: דחיסת הקובץ לתוך ZIP 🗜️
        run: |
          # אריזת הקובץ לארכיון
          zip compressed_archive.zip downloaded_file

      - name: העלאת הארטיפקט 🚀
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-artifact
          path: compressed_archive.zip
