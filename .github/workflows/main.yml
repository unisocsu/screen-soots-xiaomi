name: Download and Check File 🚀

on:
  push:
    branches:
      - main

jobs:
  download-and-pack:
    runs-on: ubuntu-latest
    env:
      # 🔗 הדבק כאן את הקישור הישיר לקובץ שלך
      DOWNLOAD_URL: "https://apkcube.com/hill-climb-racing/com.fingersoft.hillclimb/download"

    steps:
      - name: הורדת הקובץ ובדיקת תקינות 📥
        run: |
          FILENAME=$(basename "${DOWNLOAD_URL%%\?*}")
          if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ]; then
            FILENAME="downloaded_file"
          fi
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          
          echo "מוריד את הקישור..."
          curl -L -o "$FILENAME" "$DOWNLOAD_URL"
          
          echo "--- מידע על הקובץ שהורד ---"
          ls -lh "$FILENAME"
          
          # אם הקובץ קטן מ-50KB, סביר להניח שזה דף HTML או הודעת שגיאה ולא הקובץ עצמו
          FILESIZE=$(stat -c%s "$FILENAME")
          if [ "$FILESIZE" -lt 50000 ]; then
            echo "⚠️ אזהרה: הקובץ קטן מאוד! הנה התוכן שלו כדי שנבין מה ירד:"
            cat "$FILENAME"
          fi

      - name: דחיסת הקובץ לתוך ZIP 🗜️
        run: |
          zip compressed_archive.zip "$FILENAME"

      - name: העלאת הארטיפקט 🚀
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-artifact
          path: compressed_archive.zip
