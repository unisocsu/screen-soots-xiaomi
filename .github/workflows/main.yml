name: Download Cloudflare Protected File 🚀

on:
  push:
    branches:
      - main

jobs:
  download-and-pack:
    runs-on: ubuntu-latest
    env:
      # 🔗 הדבק כאן את הקישור שלך
      DOWNLOAD_URL: "https://data.winudf.com/APK/Y29tLmFscGhhaW52ZW50b3IuZmlsZW1hbmFnZXJfMjEwMzA4Ml85MzQyODM0Mg?_p=Y29tLmFscGhhaW52ZW50b3IuZmlsZW1hbmFnZXI%3D&download_id=1933704141668948&filename=File+Manager_3.8.2_APKPure.apk&full_size=13468694&is_hot=true&k=336cedd58d0c87e792eefe7b117463326a737b52&package_name=com.alphainventor.filemanager&source=web&token=1785780306-2b3207d310-0-6b8beaa41ea9c49c6c5226f200449f42"

    steps:
      - name: הגדרת סביבת Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: התקנת ספריות נדרשות ומעקף הגנות 📦
        run: pip install typing_extensions curl_cffi

      - name: הורדת הקובץ דרך הדמיית דפדפן 📥
        run: |
          python -c "
          from curl_cffi import requests
          import os
          
          url = os.environ['DOWNLOAD_URL']
          print(f'מתחיל הורדה מתוך: {url}')
          
          response = requests.get(url, impersonate='chrome', timeout=60)
          
          filename = 'downloaded_file.apk'
          if 'content-disposition' in response.headers:
              cd = response.headers['content-disposition']
              if 'filename=' in cd:
                  filename = cd.split('filename=')[-1].strip('\"\'')
          
          print(f'שומר את הקובץ בשם: {filename} (גודל: {len(response.content)} בייטים)')
          
          with open(filename, 'wb') as f:
              f.write(response.content)
          "

      - name: דחיסת הקובץ לתוך ZIP 🗜️
        run: |
          python -c "
          import glob, zipfile, os
          files = [f for f in glob.glob('*') if f not in ['.github', 'compressed_archive.zip']]
          if files:
              target = max(files, key=os.path.getsize)
              print(f'דוחס את הקובץ: {target}')
              with zipfile.ZipFile('compressed_archive.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
                  zf.write(target)
          "

      - name: העלאת הארטיפקט 🚀
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-artifact
          path: compressed_archive.zip
